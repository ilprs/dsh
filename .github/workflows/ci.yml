name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 冒烟测试命令行
        run: |
          python -m todolist --file /tmp/smoke.json add "CI 冒烟任务"
          python -m todolist --file /tmp/smoke.json list
          python -m todolist --file /tmp/smoke.json done 1
